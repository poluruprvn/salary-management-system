---
openapi: 3.0.1
info:
  title: Salary Management API
  version: v1
servers:
- url: http://localhost:3000
paths:
  "/api/v1/me":
    get:
      summary: Show the signed in user
      tags:
      - Account
      responses:
        '200':
          description: the user the access token names
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/meta":
    get:
      summary: Show the currency, the enums and the server's today
      tags:
      - Account
      responses:
        '200':
          description: the settings a client needs before its first list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/meta"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/analytics/run_rate":
    get:
      summary: Annual run rate by group
      tags:
      - Analytics
      description: Active employees on as_of, grouped. A group with nobody active
        is left out. Rows are costliest first on loaded.
      parameters:
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - department
          - country
          - level
          default: department
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Defaults to today, and is echoed back
      responses:
        '200':
          description: the run rate
          content:
            application/json:
              schema:
                type: object
                required:
                - as_of
                - group_by
                - data
                - totals
                properties:
                  as_of:
                    type: string
                    format: date
                  group_by:
                    type: string
                    enum:
                    - department
                    - country
                    - level
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - group
                      - headcount
                      - salaried
                      - gross_cents
                      - loaded_cents
                      properties:
                        group:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                        headcount:
                          type: integer
                          description: Active employees on as_of
                        salaried:
                          type: integer
                          description: Of those, how many have a salary in force.
                            The rest are not in the amounts.
                        gross_cents:
                          type: integer
                          format: int64
                          description: Annual salary in force on as_of
                        loaded_cents:
                          type: integer
                          format: int64
                          description: Gross times the country's current multiplier,
                            rounded per employee
                  totals:
                    type: object
                    required:
                    - headcount
                    - salaried
                    - gross_cents
                    - loaded_cents
                    properties:
                      headcount:
                        type: integer
                        description: Active employees on as_of
                      salaried:
                        type: integer
                        description: Of those, how many have a salary in force. The
                          rest are not in the amounts.
                      gross_cents:
                        type: integer
                        format: int64
                        description: Annual salary in force on as_of
                      loaded_cents:
                        type: integer
                        format: int64
                        description: Gross times the country's current multiplier,
                          rounded per employee
        '422':
          description: group_by or as_of is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/employees/{employee_id}/audits":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: List who changed an employee, and their salary revisions, and when
      tags:
      - Audits
      description: Newest first. Covers the employee's own changes and every change
        to their salary revisions.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 25
        description: Above 100 is clamped to 100, not refused
      responses:
        '200':
          description: a page of the trail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/audit"
                  pagination:
                    "$ref": "#/components/schemas/pagination"
        '404':
          description: no employee has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: page or per_page is not a positive integer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/auth/sign_in":
    post:
      summary: Exchange credentials for a token pair
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/token_pair"
        '400':
          description: a credential is missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the email or the password is wrong
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
        required: true
  "/api/v1/auth/refresh":
    post:
      summary: Rotate a refresh token for a new pair
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '200':
          description: rotated, and the old refresh token is now dead
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/token_pair"
        '400':
          description: no refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the refresh token is expired or has already been used
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
        required: true
  "/api/v1/auth/sign_out":
    delete:
      summary: Delete every refresh token for the signed in user
      tags:
      - Auth
      responses:
        '204':
          description: signed out
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/countries/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Update a country's employer cost multiplier
      tags:
      - Reference data
      description: Only the multiplier is editable. Every fully loaded figure uses
        the current value, past dates included.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/country"
        '404':
          description: no country has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: the multiplier is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employer_cost_multiplier:
                  type: string
                  example: '1.45'
                  description: Above 0, below 100, at most 4 decimal places
        required: true
  "/api/v1/employees":
    get:
      summary: List employees
      tags:
      - Employees
      description: Search, filter, sort and pagination all run on the server.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Part of the name, email or title, ignoring case. A whole UUID
          matches the id instead.
      - name: department_id[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: country_id[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: level_id[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: title
        in: query
        required: false
        schema:
          type: string
        description: The whole title
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - active
          - exited
        description: As of as_of
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - "-name"
          - hire_date
          - "-hire_date"
          - exit_date
          - "-exit_date"
          - salary
          - "-salary"
          - department
          - "-department"
          - country
          - "-country"
          - level
          - "-level"
          default: name
        description: A leading - sorts descending. salary and exit_date put nulls
          last either way.
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Defaults to today. Status and current_salary are computed for
          this date, and it is echoed back.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 25
        description: Above 100 is clamped to 100, not refused
      responses:
        '200':
          description: a page of employees
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/employee"
                  pagination:
                    "$ref": "#/components/schemas/pagination"
        '422':
          description: a filter, sort, as_of, page or per_page is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Create an employee
      tags:
      - Employees
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/employee"
        '422':
          description: an attribute is invalid, or the email is already in use
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - title
              - hire_date
              - country_id
              - department_id
              - level_id
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                title:
                  type: string
                  maxLength: 255
                  description: Free text. GET /api/v1/titles offers the ones already
                    in use.
                hire_date:
                  type: string
                  format: date
                exit_date:
                  type: string
                  format: date
                  nullable: true
                country_id:
                  type: string
                  format: uuid
                department_id:
                  type: string
                  format: uuid
                level_id:
                  type: string
                  format: uuid
        required: true
  "/api/v1/employees/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: Show an employee
      tags:
      - Employees
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Defaults to today. Status and current_salary are computed for
          this date, and it is echoed back.
      responses:
        '200':
          description: the employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/employee"
        '404':
          description: no employee has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: as_of is not a date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Update an employee
      tags:
      - Employees
      description: Send only the attributes that change. A null exit_date clears it.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/employee"
        '404':
          description: no employee has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: an attribute is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                title:
                  type: string
                  maxLength: 255
                  description: Free text. GET /api/v1/titles offers the ones already
                    in use.
                hire_date:
                  type: string
                  format: date
                exit_date:
                  type: string
                  format: date
                  nullable: true
                country_id:
                  type: string
                  format: uuid
                department_id:
                  type: string
                  format: uuid
                level_id:
                  type: string
                  format: uuid
        required: true
  "/api/v1/countries":
    get:
      summary: List countries
      tags:
      - Reference data
      description: A closed set, returned whole and unpaginated.
      responses:
        '200':
          description: every country
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/country"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/departments":
    get:
      summary: List departments
      tags:
      - Reference data
      description: A closed set, returned whole and unpaginated.
      responses:
        '200':
          description: every department
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/department"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/levels":
    get:
      summary: List levels
      tags:
      - Reference data
      description: A closed set, returned whole and unpaginated.
      responses:
        '200':
          description: every level
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/level"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/employees/{employee_id}/salary_revisions":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: List an employee's salary history
      tags:
      - Salary revisions
      description: Live revisions, newest first, each with the amount in force before
        it. Voided ones are left out.
      responses:
        '200':
          description: the history
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/salary_history_entry"
        '404':
          description: no employee has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a salary revision
      tags:
      - Salary revisions
      description: A raise is a new revision, never an edit. The response carries
        the revision in force before it, so a form can show the change without a second
        request. A backdated revision also changes the previous amount of the one
        after it, so reload the history rather than patching a row.
      parameters: []
      responses:
        '201':
          description: created, with the revision it follows
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/salary_change"
        '404':
          description: no employee has that id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: an attribute is invalid, or a live revision already has that
            date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_cents
              - effective_date
              - reason
              properties:
                amount_cents:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The new annual salary, in minor units
                effective_date:
                  type: string
                  format: date
                  description: May be in the future. Must fall inside the employment.
                reason:
                  type: string
                  enum:
                  - merit
                  - promotion
                  - market_adjustment
                  - correction
                note:
                  type: string
                  nullable: true
        required: true
  "/api/v1/employees/{employee_id}/salary_revisions/{id}":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Correct a salary revision
      tags:
      - Salary revisions
      description: For fixing a mistake. A raise is a new revision. A voided revision
        cannot be edited.
      parameters: []
      responses:
        '200':
          description: corrected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/salary_revision"
        '404':
          description: no revision with that id belongs to this employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: an attribute is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The new annual salary, in minor units
                effective_date:
                  type: string
                  format: date
                  description: May be in the future. Must fall inside the employment.
                reason:
                  type: string
                  enum:
                  - merit
                  - promotion
                  - market_adjustment
                  - correction
                note:
                  type: string
                  nullable: true
        required: true
    delete:
      summary: Void a salary revision
      tags:
      - Salary revisions
      description: The row is kept with voided_at set, and drops out of every read.
        Voiding twice is a no-op.
      responses:
        '204':
          description: voided
        '404':
          description: no revision with that id belongs to this employee
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/titles":
    get:
      summary: Suggest titles already in use
      tags:
      - Titles
      description: For the title typeahead. Distinct titles with how many employees
        ever held them, most used first, capped at 20. It truncates rather than paginates.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Matches anywhere in the title, ignoring case
      responses:
        '200':
          description: the most used matching titles
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/title_count"
        '401':
          description: the access token is missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/healthz":
    get:
      summary: 'Liveness: the process is up and Postgres answers'
      tags:
      - Health
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  database:
                    type: string
                    enum:
                    - ok
                    - unreachable
        '503':
          description: Postgres did not answer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  database:
                    type: string
                    enum:
                    - ok
                    - unreachable
  "/readyz":
    get:
      summary: 'Readiness: liveness plus no pending migrations'
      tags:
      - Health
      security: []
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                - migrations
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  database:
                    type: string
                    enum:
                    - ok
                    - unreachable
                  migrations:
                    type: string
                    enum:
                    - ok
                    - pending
                    - unknown
        '503':
          description: a migration is pending, or Postgres did not answer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                - migrations
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  database:
                    type: string
                    enum:
                    - ok
                    - unreachable
                  migrations:
                    type: string
                    enum:
                    - ok
                    - pending
                    - unknown
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    token_pair:
      type: object
      required:
      - access_token
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds the access token stays valid
        refresh_token:
          type: string
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
    pagination:
      type: object
      required:
      - total
      - page
      - per_page
      - total_pages
      - prev_page
      - next_page
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
          description: The page size used, after clamping to 100
        total_pages:
          type: integer
        prev_page:
          type: integer
          nullable: true
          description: Null on the first page. Past the end it is the last real page.
        next_page:
          type: integer
          nullable: true
          description: Null on the last page
    user:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    meta:
      type: object
      required:
      - base_currency
      - minor_unit
      - today
      - employee_statuses
      - salary_revision_reasons
      properties:
        base_currency:
          type: string
          example: USD
        minor_unit:
          type: integer
          description: 'Decimal places in an amount: amount_cents / 10^minor_unit'
        today:
          type: string
          format: date
          description: The as_of a request gets when it omits the parameter
        employee_statuses:
          type: array
          items:
            type: string
        salary_revision_reasons:
          type: array
          items:
            type: string
    country:
      type: object
      required:
      - id
      - code
      - name
      - employer_cost_multiplier
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: IN
        name:
          type: string
        employer_cost_multiplier:
          type: string
          example: '1.45'
          description: A decimal string, so the client never holds it as a float.
            Gross times this is fully loaded.
    department:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    level:
      type: object
      required:
      - id
      - code
      - name
      - rank
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: L4
        name:
          type: string
        rank:
          type: integer
          description: Orders levels. Sort on this, never on the code.
    employee:
      type: object
      required:
      - id
      - name
      - email
      - title
      - hire_date
      - exit_date
      - status
      - as_of
      - country
      - department
      - level
      - current_salary
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        title:
          type: string
        hire_date:
          type: string
          format: date
        exit_date:
          type: string
          format: date
          nullable: true
          description: 'Inclusive: the employee is active and paid that day'
        status:
          type: string
          enum:
          - pending
          - active
          - exited
          description: Derived from the dates, as of as_of
        as_of:
          type: string
          format: date
          description: The date status and current_salary were computed for
        country:
          "$ref": "#/components/schemas/country"
        department:
          "$ref": "#/components/schemas/department"
        level:
          "$ref": "#/components/schemas/level"
        current_salary:
          type: object
          nullable: true
          description: The live revision in force on as_of. Null unless the employee
            is active that day.
          required:
          - amount_cents
          - effective_date
          properties:
            amount_cents:
              type: integer
              format: int64
              description: Minor units of the base currency
            effective_date:
              type: string
              format: date
    salary_revision:
      type: object
      required:
      - id
      - amount_cents
      - effective_date
      - reason
      - note
      - voided_at
      properties:
        id:
          type: string
          format: uuid
        amount_cents:
          type: integer
          format: int64
          description: Minor units of the base currency
        effective_date:
          type: string
          format: date
        reason:
          type: string
          enum:
          - merit
          - promotion
          - market_adjustment
          - correction
        note:
          type: string
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
    salary_history_entry:
      type: object
      required:
      - id
      - amount_cents
      - effective_date
      - reason
      - note
      - voided_at
      - previous_amount_cents
      properties:
        id:
          type: string
          format: uuid
        amount_cents:
          type: integer
          format: int64
          description: Minor units of the base currency
        effective_date:
          type: string
          format: date
        reason:
          type: string
          enum:
          - merit
          - promotion
          - market_adjustment
          - correction
        note:
          type: string
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        previous_amount_cents:
          type: integer
          format: int64
          description: The live amount in force the day before, null for the first
            revision
          nullable: true
    salary_change:
      type: object
      required:
      - id
      - amount_cents
      - effective_date
      - reason
      - note
      - voided_at
      - previous_amount_cents
      - previous_effective_date
      properties:
        id:
          type: string
          format: uuid
        amount_cents:
          type: integer
          format: int64
          description: Minor units of the base currency
        effective_date:
          type: string
          format: date
        reason:
          type: string
          enum:
          - merit
          - promotion
          - market_adjustment
          - correction
        note:
          type: string
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        previous_amount_cents:
          type: integer
          format: int64
          description: The live amount in force the day before, null for the first
            revision
          nullable: true
        previous_effective_date:
          type: string
          format: date
          nullable: true
    audit:
      type: object
      required:
      - id
      - action
      - auditable_type
      - auditable_id
      - audited_changes
      - user
      - created_at
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
          - create
          - update
          - destroy
        auditable_type:
          type: string
          enum:
          - employee
          - salary_revision
        auditable_id:
          type: string
          format: uuid
        audited_changes:
          type: object
          additionalProperties: true
          description: On create, each attribute's value. On update, each changed
            attribute as [old, new].
        user:
          type: object
          required:
          - id
          - name
          - email
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
          nullable: true
          description: Who made the change. Null outside a signed in request.
        created_at:
          type: string
          format: date-time
    title_count:
      type: object
      required:
      - title
      - employee_count
      properties:
        title:
          type: string
        employee_count:
          type: integer
security:
- bearer_auth: []
